<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo - Biblioteca Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
</head>

<body class="bg-background text-text">
    <!-- NAVBAR: Si hay que hacer un cambio en el navbar, al tenerlo como un componente separado,
el cambio se realizará simultáneamente en todas las páginas al añadirlo por JS. En caso contrario,
habría que modificar el navbar de las 5 páginas HTML y estaríamos pendientes de liarla. -->
    <div id="marquee"></div>
    <div id="navbar" class="sticky top-0 z-50"></div>

    <main>

        <div id="error"></div>
        <div id="modal"></div>

    </main>
    <!-- FOOTER: La misma justifacion con el navbar -->
    <div id="footer"></div>

    <script src="/js/menu.js"></script>
    <script src="/js/carousel.js"></script>

</body>

</html>
